<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Une lettre pour toi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap">
<style>
:root{--bg:#f1d6da;--paper:#fff8f6;--ink:#3b1420;--soft:#7a4a57;--wax:#8e1b32;--wax2:#b0314b;--env:#e8bcc4;--env2:#dca6b0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16090e;--paper:#2a141c;--ink:#f6e3e6;--soft:#c9a0aa;--wax:#a3243d;--wax2:#d04560;--env:#4a2230;--env2:#3a1a26}}
:root[data-theme="dark"]{--bg:#16090e;--paper:#2a141c;--ink:#f6e3e6;--soft:#c9a0aa;--wax:#a3243d;--wax2:#d04560;--env:#4a2230;--env2:#3a1a26}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:"Caveat",cursive;font-size:clamp(1.35rem,4.6vw,1.7rem);overflow:hidden;display:grid;place-items:center;position:relative}
.stage{width:min(92vw,420px);position:relative;z-index:2}
/* enveloppe */
.env{position:relative;aspect-ratio:3/2;background:var(--env);border-radius:6px;box-shadow:0 18px 40px rgba(60,10,25,.25);transition:opacity .8s .5s,transform .8s .5s}
.env::before{content:"";position:absolute;inset:0;background:linear-gradient(to top right,var(--env2) 49.5%,transparent 50%) left/50% 100% no-repeat,linear-gradient(to top left,var(--env2) 49.5%,transparent 50%) right/50% 100% no-repeat;border-radius:6px}
.flap{position:absolute;left:0;right:0;top:0;height:62%;background:var(--env2);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s ease;z-index:2}
.open .flap{transform:rotateX(180deg)}
.open .env{opacity:0;transform:translateY(30px) scale(.96)}
.seal{position:absolute;left:50%;top:62%;width:76px;height:76px;margin:-38px 0 0 -38px;border:0;border-radius:50%;z-index:3;cursor:pointer;color:#fff3f3;font-size:2rem;display:grid;place-items:center;
background:radial-gradient(circle at 35% 30%,var(--wax2),var(--wax));box-shadow:0 4px 10px rgba(0,0,0,.35),inset 0 -4px 8px rgba(0,0,0,.25);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;transition:transform .2s,opacity .3s}
.seal:active,.seal.hold{transform:scale(.92)}
.seal:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.open .seal{opacity:0;pointer-events:none}
.ring{position:absolute;inset:-8px;width:calc(100% + 16px);height:calc(100% + 16px);transform:rotate(-90deg);pointer-events:none}
.ring circle{fill:none;stroke:var(--ink);stroke-width:3;stroke-dasharray:289;stroke-dashoffset:289;stroke-linecap:round}
.addr{position:absolute;left:0;right:0;bottom:8%;text-align:center;z-index:1;font:italic 500 clamp(1.4rem,6vw,1.9rem)/1 "Fraunces",Georgia,serif;color:var(--wax)}
.hint{text-align:center;margin-top:1.6rem;color:var(--soft);transition:opacity .4s}
.open .hint{opacity:0}
/* lettre */
.letter{position:absolute;left:0;right:0;top:50%;transform:translateY(-46%);background:var(--paper);padding:1.6rem 1.4rem 1.4rem;border-radius:4px;box-shadow:0 20px 50px rgba(60,10,25,.3);opacity:0;pointer-events:none;transition:opacity .9s .7s;max-height:88vh;max-height:88dvh;overflow:auto;-webkit-overflow-scrolling:touch}
.open .letter{opacity:1;pointer-events:auto}
h1{font:italic 500 clamp(1.7rem,7vw,2.2rem)/1.1 "Fraunces",Georgia,serif;margin:0 0 1rem}
.letter p{margin:0 0 .7rem;line-height:1.3;opacity:0;transform:translateY(6px);transition:opacity .8s,transform .8s}
.show p{opacity:1;transform:none}
.sign{text-align:right;color:var(--wax2)}
.days{margin-top:1rem;padding-top:.8rem;border-top:1px dashed var(--soft);color:var(--soft);text-align:center;font-size:.95em}
.days b{font:italic 500 1.5em "Fraunces",Georgia,serif;color:var(--wax2)}
.song{display:block;width:max-content;max-width:100%;margin:1rem auto 0;padding:.5rem 1.2rem;border-radius:999px;background:var(--wax);color:#fff3f3;text-decoration:none;text-align:center;opacity:0;pointer-events:none;transition:opacity .8s 8s}
.show .song{opacity:1;pointer-events:auto}
.song:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
button.again{display:block;margin:1rem auto 0;border:0;background:none;color:var(--soft);font:inherit;text-decoration:underline;cursor:pointer}
.petal{position:fixed;top:-8vh;z-index:1;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),115vh) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){.petal{display:none}.flap,.env,.letter,.letter p{transition-duration:.01s;transition-delay:0s}}
</style>
</head>
<body>
<main class="stage" id="stage">
  <div class="env">
    <div class="flap"></div>
    <div class="addr">Pour Ambre</div>
    <button class="seal" id="seal" aria-label="Maintiens appuyé pour ouvrir la lettre">♥
      <svg class="ring" viewBox="0 0 100 100"><circle id="arc" cx="50" cy="50" r="46"/></svg>
    </button>
  </div>
  <p class="hint" id="hint">Maintiens le sceau pour ouvrir ta lettre</p>
  <article class="letter" id="letter">
    <h1 id="to"></h1>
    <div id="lines"></div>
    <p class="sign" id="from"></p>
    <p class="days" id="days"></p>
    <a class="song" href="https://open.spotify.com/intl-fr/track/5HQEmiV2lKnSO6qa2fsR7x" target="_blank" rel="noopener">♫ Écouter notre chanson</a>
    <button class="again" id="again">Relire depuis le début</button>
  </article>
</main>
<script>
/* ✏️ À MODIFIER : tout se règle ici */
const CONFIG = {
  to: "Coucou ma princesse",
  from: "— Clem",
  since: "", // date de votre début (AAAA-MM-JJ), mets "" pour masquer
  lines: [
    "Petit message pour te dire que je t’aime à la folie."
  ]
};

const $ = id => document.getElementById(id);
const stage = $("stage"), seal = $("seal"), arc = $("arc");
$("to").textContent = CONFIG.to;
$("from").textContent = CONFIG.from;
const box = $("lines");
CONFIG.lines.forEach(t => { const p = document.createElement("p"); p.textContent = t; box.appendChild(p); });
const d = CONFIG.since ? Math.floor((Date.now() - new Date(CONFIG.since)) / 864e5) : null;
if (d !== null && d >= 0) $("days").innerHTML = "Ça fait <b>" + d + "</b> jours qu’on est ensemble"; else $("days").hidden = true;

function petals(n){
  if (matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  for (let i = 0; i < n; i++) {
    const s = document.createElement("span");
    s.className = "petal"; s.textContent = ["🌸","🌷","♥"][i % 3];
    s.style.left = Math.random() * 100 + "vw";
    s.style.fontSize = 14 + Math.random() * 16 + "px";
    s.style.setProperty("--dx", (Math.random() * 80 - 40) + "px");
    s.style.setProperty("--r", (Math.random() * 600 - 300) + "deg");
    s.style.animationDuration = 5 + Math.random() * 5 + "s";
    s.style.animationDelay = Math.random() * 2 + "s";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 12500);
  }
}

function reveal(){
  if (stage.classList.contains("open")) return;
  stage.classList.add("open");
  petals(26);
  [...box.children].forEach((p, i) => p.style.transitionDelay = 1.4 + i * 1.1 + "s");
  document.querySelectorAll(".sign,.days").forEach((p, i) => p.style.transitionDelay = 1.6 + (box.children.length + i) * 1.1 + "s");
  stage.classList.add("show");
}

let t0 = 0, raf = 0;
function tick(){
  const k = Math.min((performance.now() - t0) / 900, 1);
  arc.style.strokeDashoffset = 289 * (1 - k);
  if (k >= 1) { seal.classList.remove("hold"); reveal(); return; }
  raf = requestAnimationFrame(tick);
}
function start(){ if (!t0) { t0 = performance.now(); seal.classList.add("hold"); raf = requestAnimationFrame(tick); } }
function stop(){ cancelAnimationFrame(raf); t0 = 0; seal.classList.remove("hold"); if (!stage.classList.contains("open")) arc.style.strokeDashoffset = 289; }
seal.addEventListener("contextmenu", e => e.preventDefault());
seal.addEventListener("pointerdown", start);
["pointerup","pointerleave","pointercancel"].forEach(e => seal.addEventListener(e, stop));
seal.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); reveal(); } });
$("again").addEventListener("click", () => {
  stage.classList.remove("open", "show"); t0 = 0; arc.style.strokeDashoffset = 289;
  document.querySelectorAll(".letter p").forEach(p => p.style.transitionDelay = "0s");
});
</script>
</body>
</html>
